<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ATEM Audio Router</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<div class="header-left">
			<h1>ATEM Audio Router</h1>
			<div id="connection-status" class="status disconnected">Disconnected</div>
		</div>
		<div class="header-right">
			<label class="split-stereo-toggle" title="Split stereo inputs and outputs to dual mono for per-channel routing">
				<input type="checkbox" id="split-stereo-cb" />
				<span>Split Stereo</span>
			</label>
			<input type="text" id="atem-ip" placeholder="ATEM IP Address" />
			<button id="connect-btn">Connect</button>
		</div>
	</header>

	<main>
		<div id="matrix-container">
			<div id="matrix-placeholder">
				<p>Enter an ATEM IP address and click Connect to begin.</p>
			</div>
		</div>

		<aside id="preset-panel">
			<h2>Presets</h2>
			<div class="preset-save">
				<input type="text" id="preset-name" placeholder="Preset name" />
				<button id="save-preset-btn">Save</button>
			</div>
			<ul id="preset-list"></ul>
		</aside>
	</main>

	<div id="toast" class="toast hidden"></div>
	<footer id="app-build-footer" class="app-build-footer" aria-label="App version"></footer>
	<script src="index.js"></script>
</body>
</html>
